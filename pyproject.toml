[build-system]
requires = ["setuptools>=61.0", "pip-tools>=7.0.0"]
build-backend = "setuptools.build_meta"

# Dependencies are pinned in requirements.txt.lock
# Generated via: pip-compile pyproject.toml
# For dev dependencies: pip-compile --extra dev pyproject.toml

[project]
name = "masa-framework"
version = "2.0.0"
description = "Multi-Agent Scaffolding Architecture (masa) - Dynamic task decomposition and verification framework."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "masa Core Team"}]
keywords = ["multi-agent", "agentic-ai", "orchestration", "decomposition", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security"
]

dependencies = [
    "keyring>=25.7.0",
    "redis>=8.1.0",
    "pywin32>=306; sys_platform=='win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0"
]

[project.scripts]
masa = "masa.framework:main"
maso = "masa.framework:main"

[tool.setuptools.packages.find]
include = ["masa*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
